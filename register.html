<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温州商学院 - 注册</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/carousel.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">温州商学院</div>
            <ul class="nav-links">
                <li><a href="index.html" class="active">首页</a></li>
                <li><a href="characters.html">校领导介绍</a></li>
                <li><a href="story.html">校园美景</a></li>
                <li><a href="video.html">宣传视频</a></li>
            </ul>
        </div>
    </nav>

    <!-- 主图 -->
    <div class="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/主页.jpg" alt="">
            </div>
        </div>
    </div>

    <!-- 注册表单 -->
    <main class="main-content">
        <div class="auth-container">
            <h2>注册</h2>
            <form class="auth-form">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <!-- 关联表单输入字段的标签元素，其核心作用是增强表单的可访问性和用户体验 -->
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="email">电子邮箱</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">确认密码</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <div class="form-group">
                    <button type="submit" class="auth-button">注册</button>
                </div>
                <div class="auth-links">
                    <p>已有账号？<a href="index.html">立即登录</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>招生电话</h3>
                <p>0577-86698888<br>0577-86691111（国际班）</p>
            </div>
           
            <div class="footer-section">
                <h3>学校地址</h3>
                <p>温州市茶山高教园区</p>
            </div>
        </div>
        <div class="footer-bottom">
            <p>@版权｜翁一涵</p>
        </div>
    </footer>
</body>
</html>
